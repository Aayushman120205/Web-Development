<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url('IOTimage.jpg');
            background-size:cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;    
        }
        .content {
            display: flex;
            align-items: center;
            justify-content:flex-end;
            gap: 200px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .text-box {
            color: #00FFFF;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
        }
        .image-box img {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #00FFFF;
        }
    </style>
</head>
<body>
    <div class="content">
    <!-- Text in one div -->
    <div class="text-box">
      Today is my first day as an intern at<br>
      Taikisha Engineering India Private Ltd.
    </div>

    <div class="image-box">
      <img src="Aayushman.jpg" alt="My Photo">
    </div>
  </div>
</body>
</html>
