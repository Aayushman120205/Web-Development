<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="email"], input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Send Email</h1>
        <form id="emailForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="from">Sender Email:</label>
                <input type="email" id="from" name="from" value="aayushmansingh120205@gmail.com" readonly required>
            </div>
            <div class="form-group">
                <label for="to">Recipient Email:</label>
                <input type="email" id="to" name="to" value="shreshtha0311@gmail.com" readonly required>
            </div>
            <div class="form-group">
                <!-- <label for="file">Select Photo (PNG, JPG, JPEG, GIF):</label> -->
                <input type="file" id="file" name="file" accept="image/*" required>
            </div>
            <button type="submit">Send Email with Photo</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const from = document.getElementById('from').value;
            const file = document.getElementById('file').files[0];
            const status = document.getElementById('status');

            if (!file) {
                status.textContent = 'Please select a photo';
                status.style.color = 'red';
                return;
            }

            status.textContent = 'Sending...';

            const formData = new FormData();
            formData.append('from', from);
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:5000/send_email', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();
                if (response.ok) {
                    status.textContent = 'Email sent successfully!';
                    status.style.color = 'green';
                    document.getElementById('emailForm').reset();
                } else {
                    status.textContent = `Error: ${result.error}`;
                    status.style.color = 'red';
                }
            } catch (error) {
                status.textContent = 'Error: Failed to send email';
                status.style.color = 'red';
            }
        });
    </script>
</body>
</html>
