<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="grid">
        <div class="dashboard">
            <div class="cards" id="Card1">
                <div class="overlay">
                    <a href="ChangeEquipment.html" target="_blank">
                    <img src="EditImage.jpg" alt="Edit id" class="pencil">
                    </a>
                </div>
                <p class="Name">Temperature</p>
                <p class="input" id="temp-value">... °C</p>
            </div>
            <div class="cards" id="Card2">
                <div class="overlay">
                    <a href="ChangeEquipment.html" target="_blank">
                    <img src="EditImage.jpg" alt="Edit id" class="pencil">
                    </a>
                </div>
                <p class="Name">Humidity</p>
                <p class="input" id="humidity-value">... g/m&sup3</p>
            </div>
            <div class="cards" id="Card3">
                <div class="overlay">
                    <a href="ChangeEquipment.html" target="_blank">
                    <img src="EditImage.jpg" alt="Edit id" class="pencil">
                    </a>
                </div>
                <p class="Name">Voltage</p>
                <p class="input" id="voltage-value">... V</p>
            </div>
            <div class="cards" id="Card4">
                <div class="overlay">
                    <a href="ChangeEquipment.html" target="_blank">
                    <img src="EditImage.jpg" alt="Edit id" class="pencil">
                    </a>
                </div>
                <p class="Name">Current</p>
                <p class="input" id="current-value">... A</p>
            </div>
        </div>
        <div class="graph-analysis">
            <div class="graphBox" id="G1">
                <div class="over">
                    <a href="https://www.google.com" target="_blank">
                    <img src="EditImage.jpg" alt="Edit id" class="pencil">
                    </a>
                </div>
                <canvas id="myChart" class="graph"></canvas>
            </div>
            <div class="graphBox" id="G2">
                <div class="over">
                    <a href="https://www.google.com" target="_blank">
                    <img src="EditImage.jpg" alt="Edit id" class="pencil">
                    </a>
                </div>
                <canvas id="myCharting" class="graph"></canvas>
            </div>
        </div>
        <div class="pieChart-analysis">
            <div class="pieChart" id="chart1">
                <canvas id="p1"class="pie"></canvas>
            </div>
            <div class="pieChart" id="chart2">
                <canvas id="p2" class="pie"></canvas>
            </div>
            <div class="pieChart" id="chart3">
                <canvas id="p3" class="pie" ></canvas>
            </div>  
            <div class="pieChart" id="chart4">
                <canvas id="p4"class="pie"></canvas>
            </div>          
        </div>
    </div>
</body>
</html>
